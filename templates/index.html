<!DOCTYPE html>
<html>
<head>
    <title>LLM对话助手</title>
    <script>
        async function submitQuery() {
            const input = document.getElementById("user-input").value;
            const responseDiv = document.getElementById("response");
            
            if (!input) {
                responseDiv.innerHTML = "<p>输入不能为空！</p>";
                return;
            }

            responseDiv.innerHTML = "<p>思考中...</p>";
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: input })
                });
                const result = await response.json();
                responseDiv.innerHTML = `<p><strong>回答：</strong>${result.answer}</p>`;
            } catch (error) {
                responseDiv.innerHTML = `<p>请求失败：${error.message}</p>`;
            }
        }
    </script>
</head>
<body>
    <h1>Qwen大模型助手</h1>
    <textarea id="user-input" rows="4" cols="50" placeholder="输入您的问题..."></textarea>
    <br>
    <button onclick="submitQuery()">提交</button>
    <div id="response" style="margin-top: 20px;"></div>
</body>
</html>
